version = 1

[[annotations]]
path = ["src/**", "public/js/sim/**", "public/index.php", "bin/**", "config/**", "tests/**", "scripts/**", ".claude/**", ".github/**", "migrations/**", "templates/**", "public/js/game/**", "public/assets/css/**", "public/.htaccess"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 SilverDay Media"
SPDX-License-Identifier = "MIT"

# Original Gloamhollow and Lantern Delve sources, kept as porting references. MIT (decisions #6, #60).
[[annotations]]
path = ["reference/gloamhollow/**", "reference/lantern-delve/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 SilverDay Media"
SPDX-License-Identifier = "MIT"

# three.js r187, vendored unchanged (decision #52).
[[annotations]]
path = ["public/js/vendor/three/**"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2026 three.js authors"
SPDX-License-Identifier = "MIT"

# Spectral and VT323, vendored as Latin woff2 (decision #53); licence texts beside them.
[[annotations]]
path = ["public/assets/fonts/spectral-*"]
precedence = "override"
SPDX-FileCopyrightText = "2017 The Spectral Project Authors"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["public/assets/fonts/vt323-*"]
precedence = "override"
SPDX-FileCopyrightText = "2011 The VT323 Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# The bestiary's Lantern Delve foes take their names and base stats from Rogue 5.4 (spec §4.9.5, decision #60);
# Rogue's notice ships with the game as public/legal/rogue-licence.txt.
[[annotations]]
path = ["public/js/sim/data/bestiary.v1.json"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 SilverDay Media", "1980-1983, 1985, 1999 Michael Toy, Ken Arnold and Glenn Wichman"]
SPDX-License-Identifier = "MIT AND LicenseRef-Rogue"

[[annotations]]
path = ["public/legal/rogue-licence.txt"]
precedence = "override"
SPDX-FileCopyrightText = "1980-1983, 1985, 1999 Michael Toy, Ken Arnold and Glenn Wichman"
SPDX-License-Identifier = "LicenseRef-Rogue"

# The banner and the social-preview crop show the Tombwright wordmark, which spec §13 excludes from CC BY-SA:
# all rights reserved (LICENSES/LicenseRef-SilverDay-AllRightsReserved.txt).
[[annotations]]
path = ["public/assets/images/tombwright-banner-1600.jpg", "public/assets/images/tombwright-banner-1600.webp", "public/assets/images/tombwright-og-1200x630.jpg"]
precedence = "override"
SPDX-FileCopyrightText = "2026 SilverDay Media"
SPDX-License-Identifier = "LicenseRef-SilverDay-AllRightsReserved"
